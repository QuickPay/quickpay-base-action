name: Test and Build

on: [push]

jobs:
  test:
    runs-on: "ubuntu-22.04"
    env:
      RACK_ENV: test
      PG_HOST: localhost
      PG_USER: backends_u
      PG_PASSWORD: abc
    steps:
      - uses: actions/checkout@v2
      - uses: quickpay/postgresql-action@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "12"
          cache: "npm"
      - run: npm install && npm run build
      - uses: ./dist/
        with:
          ssh_key: "${{secrets.SSH_KEY_GITHUB}}"
          prod_apt_deps: true
          chrome: true
          rubocop: true
          postgres: true
          gem_server_credentials: "${{secrets.BUNDLE_GEMS__QUICKPAY__NET}}"
          gem_github_credentials: ${{secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM}}
          set_env_var: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
      - run: git clone git@github.com:QuickPay/klarna-payments-backend.git
      - run: gem install bundler -v 2.4.22
      - name: Tests
        run: cd integration_test && bundle install && bundle exec rake test
      - run: cd klarna-payments-backend && bundle install
      - name: Setup Git for publishing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Create and switch to build branch
        run: |
          echo "Checking if build branch exists..."
          git fetch origin build:build || echo "Build branch doesn't exist yet, will create it"
          git checkout -B build
      - name: Clear build branch and copy dist contents
        run: |
          echo "Clearing current build branch contents..."
          git rm -rf . || echo "No files to remove"
          echo "Copying dist contents to root..."
          cp -r dist/* . || echo "No files in dist to copy"
          ls -la
      - name: Commit and push to build branch
        run: |
          echo "Adding files to git..."
          git add .
          echo "Committing changes..."
          git commit -m "Build from commit ${{ github.sha }}" || echo "No changes to commit"
          echo "Pushing to build branch..."
          git push origin build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
