name: Test and Build

on: [push]

jobs:
  test_build:
    runs-on: "ubuntu-22.04"
    env:
      RACK_ENV: test
      PG_HOST: localhost
      PG_USER: backends_u
      PG_PASSWORD: abc
    steps:
      - uses: actions/checkout@v2
      - uses: quickpay/postgresql-action@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "12"
          cache: "npm"
      - run: npm install && npm run build
      - uses: ./dist/
        with:
          ssh_key: "${{secrets.SSH_KEY_GITHUB}}"
          prod_apt_deps: true
          chrome: true
          rubocop: true
          postgres: true
          gem_server_credentials: "${{secrets.BUNDLE_GEMS__QUICKPAY__NET}}"
          gem_github_credentials: ${{secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM}}
          set_env_var: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
      - run: git clone git@github.com:QuickPay/klarna-payments-backend.git
      - run: gem install bundler -v 2.4.22
      - name: Tests
        run: cd integration_test && bundle install && bundle exec rake test
      - run: cd klarna-payments-backend && bundle install

      - name: Clone payment
        run: git clone git@github.com:QuickPay/payment.git

      - name: Setup Ruby for payment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7

      - name: Install Bundler for payment
        run: gem install bundler -v 2.4.22

      - name: Test payment
        run: |
          ln -sf keystore_ekeys.yml-devbox config/keystore_ekeys.yml
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec rspec
        working-directory: payment

      - uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
